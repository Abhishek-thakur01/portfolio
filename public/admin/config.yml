backend:
  name: github
  repo: Abhishek-thakur01/portfolio
  branch: main
  # For GitHub auth you need an OAuth App + proxy.
  # Easiest free option: use Decap Turbo or set up a Cloudflare Worker proxy.

media_folder: public/images
public_folder: /images

collections:
  - name: settings
    label: Site Settings
    files:
      - name: general
        label: General Info
        file: src/content/site.json
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Title, name: title, widget: string }
          - { label: About Text, name: about, widget: text }
          - { label: Email, name: email, widget: string }
          - { label: Phone, name: phone, widget: string }
          - { label: Location, name: location, widget: string }

  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Category, name: category, widget: select, options: ["uiux", "graphic", "video", "content"] }
      - { label: Type, name: type, widget: string }
      - { label: Image, name: image, widget: image }
      - { label: Tags, name: tags, widget: list }
      - { label: Description, name: description, widget: text }

  - name: experience
    label: Experience
    folder: src/content/experience
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Years, name: years, widget: string }
      - { label: Role, name: role, widget: string }
      - { label: Company, name: place, widget: string }
      - { label: Tags, name: tags, widget: string }
